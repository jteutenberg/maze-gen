<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maze SVG</title>
  <style>
    body {
      margin: 24px;
      font-family: system-ui, sans-serif;
      color: #222;
      background: #f7f7f7;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 8px;
    }
    p {
      margin: 0 0 16px;
      max-width: 42rem;
    }
    form {
      display: grid;
      gap: 12px;
      max-width: 42rem;
    }
    textarea {
      font-family: ui-monospace, "Cascadia Code", "Source Code Pro", monospace;
      font-size: 16px;
      line-height: 1.3;
      width: 100%;
      min-height: 12rem;
      box-sizing: border-box;
      padding: 8px;
    }
    .entrances {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 24px;
    }
    .pair {
      display: flex;
      gap: 8px;
      align-items: end;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.875rem;
    }
    input {
      width: 4.5rem;
      padding: 4px 6px;
      font: inherit;
    }
    button {
      width: fit-content;
      padding: 6px 16px;
      font: inherit;
    }
    #error {
      min-height: 1.2em;
      color: #a40000;
      margin: 0;
    }
    #output {
      margin-top: 8px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <h1>Maze SVG</h1>
  <p>
    Paste the maze text, then give the entrance coordinates.
    x increases to the right and y increases upward.
    A vertical bridge runs north–south. A horizontal bridge uses the same drawing rotated.
  </p>
  <form id="form">
    <textarea id="maze" spellcheck="false">(6,1)-(0,3)
╥╔════╗
╚╩╦══╗║
╔╗╨╔═╝║
╨╚╗║╔╗║
╔╗║╚╝║║
║╠╝╔╡╚╫
╚╩═╩══╝</textarea>
    <div class="entrances">
      <div class="pair">
        <label>Entrance 1 x <input id="x1" value="6" inputmode="numeric" autocomplete="off"></label>
        <label>y <input id="y1" value="1" inputmode="numeric" autocomplete="off"></label>
      </div>
      <div class="pair">
        <label>Entrance 2 x <input id="x2" value="0" inputmode="numeric" autocomplete="off"></label>
        <label>y <input id="y2" value="3" inputmode="numeric" autocomplete="off"></label>
      </div>
    </div>
    <button type="submit">Render</button>
    <p id="error" role="status"></p>
  </form>
  <div id="output"></div>
  <script src="maze.js"></script>
  <script>
    const form = document.getElementById("form");
    const error = document.getElementById("error");
    const output = document.getElementById("output");

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      error.textContent = "";
      try {
        const lines = document.getElementById("maze").value.split(/\r?\n/);
        const svg = mazeSvg.renderMazeSvg(lines, readEntrances());
        output.innerHTML = svg;
      } catch (err) {
        output.innerHTML = "";
        error.textContent = err.message || String(err);
      }
    });

    function readEntrances() {
      return [readPair("x1", "y1", 1), readPair("x2", "y2", 2)].filter(Boolean);
    }

    function readPair(xId, yId, n) {
      const xs = document.getElementById(xId).value.trim();
      const ys = document.getElementById(yId).value.trim();
      if (xs === "" && ys === "") return null;
      if (xs === "" || ys === "") {
        throw new Error("Enter both x and y for entrance " + n);
      }
      if (!/^-?\d+$/.test(xs) || !/^-?\d+$/.test(ys)) {
        throw new Error("Entrance " + n + " coordinates must be integers");
      }
      return { x: Number(xs), y: Number(ys) };
    }
  </script>
</body>
</html>
